name: "docforge"
description: "Generate developer and end-user documentation from a codebase."
author: "Nikola Reljin"

inputs:
  api_key:
    description: "API key for the LLM provider (sets DOCFORGE_API_KEY)."
    required: false
    default: ""

  anthropic_api_key:
    description: "Deprecated: use api_key instead."
    required: false
    default: ""

  config:
    description: "Path to the .docforge.yml config file (relative to repo root)."
    required: false
    default: ".docforge.yml"

  repo_path:
    description: "Path to the repository to document."
    required: false
    default: "."

  only:
    description: "Which documents to generate: developer, user, or both."
    required: false
    default: "both"

  output_dir:
    description: "Override the output directory (relative to repo_path)."
    required: false
    default: ""

  notebooklm_upload:
    description: "Upload NOTEBOOKLM.md to Google NotebookLM after generation."
    required: false
    default: "false"

  notebooklm_project_number:
    description: "GCP project number for the NotebookLM upload."
    required: false
    default: ""

  notebooklm_notebook_id:
    description: "NotebookLM notebook ID (from the notebook URL)."
    required: false
    default: ""

  notebooklm_location:
    description: "GCP resource location (default: global)."
    required: false
    default: "global"

  notebooklm_endpoint_location:
    description: "Discovery Engine endpoint location (default: global)."
    required: false
    default: "global"

  notebooklm_sa_key:
    description: "Service account key JSON string for Google auth."
    required: false
    default: ""

runs:
  using: "composite"
  steps:
    - name: "Set up Python"
      uses: "actions/setup-python@v5"
      with:
        python-version: "3.11"

    - name: "Install docforge dependencies"
      shell: bash
      run: |
        pip install --quiet httpx>=0.27 pyyaml>=6.0

    - name: "Install NotebookLM upload dependencies"
      if: ${{ inputs.notebooklm_upload == 'true' }}
      shell: bash
      run: |
        pip install --quiet "google-auth>=2.0" requests>=2.31

    - name: "Run docforge"
      shell: bash
      env:
        # Provider-agnostic key — picked up by all named providers as fallback.
        DOCFORGE_API_KEY: ${{ inputs.api_key || inputs.anthropic_api_key }}
        # Provider-specific vars so each provider's primary lookup succeeds.
        GROQ_API_KEY: ${{ inputs.api_key || inputs.anthropic_api_key }}
        ANTHROPIC_API_KEY: ${{ inputs.api_key || inputs.anthropic_api_key }}
        # GitHub Models: prefer explicit api_key, fall back to the automatic token.
        GITHUB_TOKEN: ${{ inputs.api_key || inputs.anthropic_api_key || github.token }}
        GITHUB_ACTION_PATH: ${{ github.action_path }}
        # NotebookLM upload
        NOTEBOOKLM_UPLOAD: ${{ inputs.notebooklm_upload }}
        NOTEBOOKLM_PROJECT_NUMBER: ${{ inputs.notebooklm_project_number }}
        NOTEBOOKLM_NOTEBOOK_ID: ${{ inputs.notebooklm_notebook_id }}
        NOTEBOOKLM_LOCATION: ${{ inputs.notebooklm_location }}
        NOTEBOOKLM_ENDPOINT_LOCATION: ${{ inputs.notebooklm_endpoint_location }}
        NOTEBOOKLM_SA_KEY_JSON: ${{ inputs.notebooklm_sa_key }}
      run: |
        ARGS=(
          --config "${{ inputs.config }}"
          --repo-path "${{ inputs.repo_path }}"
          --only "${{ inputs.only }}"
        )
        if [ -n "${{ inputs.output_dir }}" ]; then
          ARGS+=(--output-dir "${{ inputs.output_dir }}")
        fi
        python "${{ github.action_path }}/generate.py" "${ARGS[@]}"
